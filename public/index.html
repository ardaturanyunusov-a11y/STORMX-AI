<!DOCTYPE html>
<html lang="az">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>STORMX AI - Anka Qusu Ultimate Live</title>
    <style>
        * {
            box-sizing: border-box;
        }
        body {
            background-color: #0b0f19;
            color: #ffffff;
            font-family: Arial, sans-serif;
            margin: 0;
            padding: 0;
            display: flex;
            flex-direction: column;
            height: 100vh;
            overflow: hidden;
        }
        header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 12px 20px;
            background-color: #111827;
            border-bottom: 1px solid #1f2937;
            z-index: 10;
        }
        .logo-area {
            display: flex;
            align-items: center;
            gap: 10px;
        }
        .logo {
            color: #f59e0b;
            font-weight: bold;
            font-size: 1.1rem;
            letter-spacing: 1px;
        }
        .header-controls {
            display: flex;
            align-items: center;
            gap: 8px;
        }
        select {
            background-color: #1f2937;
            color: #ffffff;
            border: 1px solid #374151;
            padding: 6px 10px;
            border-radius: 6px;
            outline: none;
            cursor: pointer;
            font-weight: bold;
            font-size: 0.9rem;
        }
        .live-btn {
            background-color: #1f2937;
            color: #ef4444;
            border: 1px solid #374151;
            padding: 6px 12px;
            border-radius: 6px;
            cursor: pointer;
            font-weight: bold;
            font-size: 0.85rem;
            transition: all 0.2s;
        }
        .live-btn.active {
            background-color: #22c55e;
            color: #ffffff;
            border-color: #22c55e;
            box-shadow: 0 0 15px rgba(34, 197, 94, 0.6);
        }
        .status-badge {
            background-color: #1f2937;
            color: #f59e0b;
            padding: 6px 12px;
            border-radius: 20px;
            font-size: 0.85rem;
            display: flex;
            align-items: center;
            gap: 6px;
            border: 1px solid #374151;
            font-weight: bold;
        }
        .status-dot {
            width: 7px;
            height: 7px;
            background-color: #f59e0b;
            border-radius: 50%;
        }

        /* Əsas Chat Ekranı */
        .chat-container {
            flex: 1;
            overflow-y: auto;
            padding: 15px;
            display: flex;
            flex-direction: column;
            gap: 15px;
        }
        .message {
            max-width: 85%;
            padding: 12px 16px;
            border-radius: 12px;
            line-height: 1.5;
            word-break: break-word;
            font-size: 0.95rem;
        }
        .ai-message {
            background-color: #161e2e;
            color: #e5e7eb;
            align-self: flex-start;
            border: 1px solid #1f2937;
        }
        .user-message {
            background-color: #1f2937;
            color: #ffffff;
            align-self: flex-end;
            border: 1px solid #374151;
        }
        .message-sender {
            font-size: 0.75rem;
            color: #9ca3af;
            margin-bottom: 4px;
            text-transform: uppercase;
        }
        .message img {
            max-width: 100%;
            border-radius: 8px;
            margin-top: 8px;
        }

        /* ULTIMATE LIVE PORTAL */
        .live-overlay {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(11, 15, 25, 0.92);
            backdrop-filter: blur(14px);
            z-index: 100;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 15px;
            animation: dropFromSky 0.4s cubic-bezier(0.175, 0.885, 0.32, 1.275) forwards;
        }

        @keyframes dropFromSky {
            0% { opacity: 0; transform: translateY(-50px) scale(0.95); }
            100% { opacity: 1; transform: translateY(0) scale(1); }
        }

        .glass-portal {
            width: 100%;
            max-width: 520px;
            background: linear-gradient(145deg, rgba(31, 41, 55, 0.85), rgba(15, 23, 42, 0.95));
            border: 2px solid rgba(245, 158, 11, 0.5);
            box-shadow: 0 25px 60px rgba(0, 0, 0, 0.9), 0 0 35px rgba(245, 158, 11, 0.3);
            border-radius: 24px;
            padding: 30px 20px;
            display: flex;
            flex-direction: column;
            align-items: center;
            text-align: center;
            position: relative;
            overflow: hidden;
            transition: border-color 0.3s, box-shadow 0.3s;
        }

        .glass-portal.state-listening { border-color: #f59e0b; box-shadow: 0 0 35px rgba(245, 158, 11, 0.3); }
        .glass-portal.state-thinking { border-color: #3b82f6; box-shadow: 0 0 35px rgba(59, 130, 246, 0.4); }
        .glass-portal.state-speaking { border-color: #ef4444; box-shadow: 0 0 45px rgba(239, 68, 68, 0.5); }
        .glass-portal.state-error { border-color: #dc2626; box-shadow: 0 0 35px rgba(220, 38, 38, 0.5); }

        #portalCanvas {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            pointer-events: none;
            z-index: 1;
        }

        .portal-content {
            position: relative;
            z-index: 2;
            width: 100%;
            display: flex;
            flex-direction: column;
            align-items: center;
        }

        .anka-bird-container {
            width: 120px;
            height: 120px;
            border-radius: 50%;
            background: radial-gradient(circle, rgba(245, 158, 11, 0.3) 0%, rgba(239, 68, 68, 0.2) 70%, transparent 100%);
            display: flex;
            justify-content: center;
            align-items: center;
            position: relative;
            margin-bottom: 15px;
            border: 2px solid #f59e0b;
            box-shadow: 0 0 25px rgba(245, 158, 11, 0.5);
            animation: floatBird 3s ease-in-out infinite;
        }

        @keyframes floatBird {
            0%, 100% { transform: translateY(0); }
            50% { transform: translateY(-8px); }
        }

        .anka-emoji {
            font-size: 3.5rem;
            transition: transform 0.2s;
        }

        .anka-bird-container.speaking-active .anka-emoji {
            animation: talkMouth 0.25s infinite alternate ease-in-out;
        }

        @keyframes talkMouth {
            0% { transform: scale(1) rotate(-3deg); }
            100% { transform: scale(1.18) rotate(3deg); filter: drop-shadow(0 0 12px #ef4444); }
        }

        .live-title {
            color: #f59e0b;
            font-size: 1.2rem;
            font-weight: bold;
            margin-bottom: 10px;
            letter-spacing: 1px;
        }

        .live-speech-bubble {
            background-color: rgba(17, 24, 39, 0.95);
            border: 1px solid #374151;
            padding: 15px;
            border-radius: 14px;
            color: #e5e7eb;
            font-size: 1rem;
            min-height: 60px;
            width: 100%;
            display: flex;
            align-items: center;
            justify-content: center;
            margin-bottom: 12px;
            line-height: 1.4;
        }

        .mic-status-indicator {
            font-size: 0.85rem;
            color: #22c55e;
            font-weight: bold;
            margin-bottom: 15px;
            display: flex;
            align-items: center;
            gap: 6px;
        }

        .settings-row {
            display: flex;
            align-items: center;
            gap: 10px;
            margin-bottom: 20px;
            background: rgba(17, 24, 39, 0.6);
            padding: 8px 15px;
            border-radius: 10px;
            border: 1px solid #374151;
            font-size: 0.85rem;
            color: #9ca3af;
        }
        .settings-row input[type="range"] {
            accent-color: #f59e0b;
            cursor: pointer;
        }

        .close-live-btn {
            background-color: #ef4444;
            color: #ffffff;
            border: none;
            padding: 10px 25px;
            border-radius: 12px;
            font-weight: bold;
            cursor: pointer;
            font-size: 0.95rem;
            transition: background-color 0.2s;
        }
        .close-live-btn:hover {
            background-color: #dc2626;
        }

        .input-container {
            padding: 12px 15px;
            background-color: #111827;
            border-top: 1px solid #1f2937;
            display: flex;
            gap: 8px;
            align-items: center;
            z-index: 10;
        }
        input[type="text"] {
            flex: 1;
            background-color: #1f2937;
            border: 1px solid #374151;
            padding: 10px 12px;
            border-radius: 8px;
            color: #ffffff;
            outline: none;
            font-size: 0.95rem;
        }
        input[type="text"]::placeholder {
            color: #9ca3af;
        }
        .tool-btn {
            background-color: #1f2937;
            color: #f59e0b;
            border: 1px solid #374151;
            padding: 9px 12px;
            border-radius: 8px;
            cursor: pointer;
            font-size: 1rem;
            transition: background-color 0.2s;
            flex-shrink: 0;
        }
        .tool-btn:hover {
            background-color: #374151;
        }
        button.send-btn {
            background-color: #f59e0b;
            color: #0b0f19;
            border: none;
            padding: 0 18px;
            height: 40px;
            border-radius: 8px;
            font-weight: bold;
            cursor: pointer;
            transition: background-color 0.2s;
            flex-shrink: 0;
            font-size: 0.9rem;
        }
        button.send-btn:hover {
            background-color: #d97706;
        }
        #infoText {
            font-size: 0.75rem;
            color: #f59e0b;
            max-width: 90px;
            overflow: hidden;
            text-overflow: ellipsis;
            white-space: nowrap;
        }

        @media (max-width: 480px) {
            header { padding: 10px 12px; }
            .logo { font-size: 0.95rem; }
            .status-badge { display: none; }
            .glass-portal { padding: 20px 15px; }
            .anka-bird-container { width: 100px; height: 100px; margin-bottom: 12px; }
            .anka-emoji { font-size: 2.8rem; }
            .live-title { font-size: 1.05rem; }
            .live-speech-bubble { font-size: 0.9rem; padding: 12px; min-height: 50px; }
            button.send-btn { padding: 0 12px; font-size: 0.8rem; }
        }
    </style>
</head>
<body>

    <header>
        <div class="logo-area">
            <div class="logo">STORMX AI</div>
        </div>
        <div class="header-controls">
            <button id="liveBtn" class="live-btn">🔴 LIVE</button>
            <select id="languageSelect">
                <option value="AZ">AZ</option>
                <option value="EN">EN</option>
                <option value="RU">RU</option>
            </select>
            <div class="status-badge">
                <div class="status-dot"></div> HAZIR
            </div>
        </div>
    </header>

    <div class="chat-container" id="chatContainer">
        <div class="message ai-message">
            <div class="message-sender">STORMX AI</div>
            Salam! Mən STORMX AI-yam. Sürətli və harf-harf yazı maşını effekti ilə səni gözləyirəm!
        </div>
    </div>

    <!-- ULTIMATE LIVE PORTAL -->
    <div id="liveOverlay" class="live-overlay" style="display: none;">
        <div id="glassPortal" class="glass-portal state-listening">
            <canvas id="portalCanvas"></canvas>
            <div class="portal-content">
                <div id="ankaBirdContainer" class="anka-bird-container">
                    <span class="anka-emoji">🦅</span>
                </div>
                <div class="live-title">ANKA QUSU - ULTIMATE LIVE</div>
                <div id="liveSpeechText" class="live-speech-bubble">
                    Salam! Mən Anka Qusuyam. Səni dinləyirəm, buyur danış...
                </div>
                <div id="micStatusIndicator" class="mic-status-indicator">
                    🎤 Mikrofon aktivdir, danış və ya əmr ver...
                </div>
                <div class="settings-row">
                    <label for="speedRange">Səs Sürəti:</label>
                    <input type="range" id="speedRange" min="0.7" max="1.4" step="0.1" value="1">
                    <span id="speedVal">1.0x</span>
                </div>
                <button class="close-live-btn" id="closeLiveBtn">LIVE-I BAĞLA</button>
            </div>
        </div>
    </div>

    <div class="input-container">
        <input type="file" id="imageInput" accept="image/*" style="display: none;">
        <button class="tool-btn" onclick="document.getElementById('imageInput').click()" title="Şəkil yüklə">📷</button>
        <button class="tool-btn" id="micBtn" title="Səslə danış">🎤</button>
        <span id="infoText"></span>
        <input type="text" id="userInput" placeholder="Mesaj yazın və ya səslə...">
        <button class="send-btn" id="sendBtn">GÖNDƏR</button>
    </div>

    <script>
        const chatContainer = document.getElementById('chatContainer');
        const userInput = document.getElementById('userInput');
        const sendBtn = document.getElementById('sendBtn');
        const languageSelect = document.getElementById('languageSelect');
        const imageInput = document.getElementById('imageInput');
        const micBtn = document.getElementById('micBtn');
        const liveBtn = document.getElementById('liveBtn');
        const liveOverlay = document.getElementById('liveOverlay');
        const glassPortal = document.getElementById('glassPortal');
        const closeLiveBtn = document.getElementById('closeLiveBtn');
        const liveSpeechText = document.getElementById('liveSpeechText');
        const micStatusIndicator = document.getElementById('micStatusIndicator');
        const ankaBirdContainer = document.getElementById('ankaBirdContainer');
        const infoText = document.getElementById('infoText');
        const speedRange = document.getElementById('speedRange');
        const speedVal = document.getElementById('speedVal');
        const portalCanvas = document.getElementById('portalCanvas');

        let chatHistory = [];
        let selectedImageBase64 = null;
        let selectedImageMimeType = null;
        let isLiveMode = false;
        let recognition = null;
        let isAiSpeaking = false;

        speedRange.addEventListener('input', () => {
            speedVal.textContent = speedRange.value + 'x';
        });

        const ctx = portalCanvas.getContext('2d');
        let particles = [];
        let animationFrameId;

        function resizeCanvas() {
            portalCanvas.width = glassPortal.offsetWidth;
            portalCanvas.height = glassPortal.offsetHeight;
        }

        class Particle {
            constructor() {
                this.reset();
            }
            reset() {
                this.x = Math.random() * portalCanvas.width;
                this.y = portalCanvas.height + 10;
                this.size = Math.random() * 3 + 1;
                this.speedY = Math.random() * 1.5 + 0.5;
                this.speedX = (Math.random() - 0.5) * 1;
                this.color = Math.random() > 0.5 ? '#f59e0b' : '#ef4444';
                this.alpha = Math.random() * 0.7 + 0.3;
            }
            update() {
                this.y -= this.speedY;
                this.x += this.speedX;
                this.alpha -= 0.005;
                if (this.alpha <= 0 || this.y < 0) {
                    this.reset();
                }
            }
            draw() {
                ctx.save();
                ctx.globalAlpha = this.alpha;
                ctx.fillStyle = this.color;
                ctx.beginPath();
                ctx.arc(this.x, this.y, this.size, 0, Math.PI * 2);
                ctx.fill();
                ctx.restore();
            }
        }

        function initParticles() {
            particles = [];
            for (let i = 0; i < 35; i++) {
                particles.push(new Particle());
            }
        }

        function animateCanvas() {
            ctx.clearRect(0, 0, portalCanvas.width, portalCanvas.height);
            particles.forEach(p => {
                p.update();
                p.draw();
            });

            if (isLiveMode) {
                const centerX = portalCanvas.width / 2;
                const centerY = 90;
                const time = Date.now() * 0.003;
                const radius = 60 + Math.sin(time) * (isAiSpeaking ? 12 : 5);

                ctx.save();
                ctx.strokeStyle = isAiSpeaking ? 'rgba(239, 68, 68, 0.4)' : 'rgba(245, 158, 11, 0.3)';
                ctx.lineWidth = 2;
                ctx.beginPath();
                ctx.arc(centerX, centerY, radius, 0, Math.PI * 2);
                ctx.stroke();
                ctx.restore();
            }

            animationFrameId = requestAnimationFrame(animateCanvas);
        }

        function setPortalState(state) {
            glassPortal.className = 'glass-portal state-' + state;
        }

        if ('webkitSpeechRecognition' in window || 'SpeechRecognition' in window) {
            const SpeechRecognition = window.SpeechRecognition || window.webkitSpeechRecognition;
            recognition = new SpeechRecognition();
            recognition.continuous = true;
            recognition.interimResults = true;

            recognition.onresult = (event) => {
                if (isAiSpeaking) return;
                let transcript = '';
                for (let i = event.resultIndex; i < event.results.length; i++) {
                    transcript += event.results[i][0].transcript;
                }
                
                const lowerTranscript = transcript.toLowerCase().trim();
                if (lowerTranscript.includes('bağla') || lowerTranscript.includes('dayandır')) {
                    closeLiveBtn.click();
                    return;
                }

                userInput.value = transcript;
                if (isLiveMode) {
                    liveSpeechText.textContent = `Siz: "${transcript}"`;
                    setPortalState('thinking');
                }
            };

            recognition.onerror = () => {
                if (isLiveMode && !isAiSpeaking) {
                    try { recognition.start(); } catch(e) {}
                }
            };

            recognition.onend = () => {
                if (isLiveMode && !isAiSpeaking) {
                    try { recognition.start(); } catch(e) {}
                }
            };
        }

        function startListening() {
            if (!recognition) return;
            try {
                const langMap = { 'AZ': 'az-AZ', 'EN': 'en-US', 'RU': 'ru-RU' };
                recognition.lang = langMap[languageSelect.value] || 'az-AZ';
                recognition.start();
                setPortalState('listening');
                if (micStatusIndicator) micStatusIndicator.textContent = '🎤 Mikrofon aktivdir, danış və ya əmr ver...';
            } catch (e) {}
        }

        function stopListening() {
            if (!recognition) return;
            try {
                recognition.stop();
            } catch (e) {}
        }

        liveBtn.addEventListener('click', () => {
            isLiveMode = true;
            chatContainer.innerHTML = '';
            liveOverlay.style.display = 'flex';
            liveBtn.classList.add('active');
            liveBtn.textContent = '🟢 LIVE AKTİV';
            
            setTimeout(() => {
                resizeCanvas();
                initParticles();
                animateCanvas();
            }, 50);

            startListening();
            speakText("Salam! Mən Anka Qusuyam. Səni dinləyirəm, buyur danış.");
        });

        closeLiveBtn.addEventListener('click', () => {
            isLiveMode = false;
            stopListening();
            cancelAnimationFrame(animationFrameId);
            liveOverlay.style.display = 'none';
            liveBtn.classList.remove('active');
            liveBtn.textContent = '🔴 LIVE';
            if ('speechSynthesis' in window) {
                window.speechSynthesis.cancel();
            }
            ankaBirdContainer.classList.remove('speaking-active');
        });

        function speakText(text) {
            if (!('speechSynthesis' in window)) return;
            window.speechSynthesis.cancel();
            
            isAiSpeaking = true;
            stopListening();
            setPortalState('speaking');

            liveSpeechText.textContent = text;
            if (micStatusIndicator) micStatusIndicator.textContent = '🦅 Anka Qusu danışır...';

            const utterance = new SpeechSynthesisUtterance(text);
            const langMap = { 'AZ': 'az-AZ', 'EN': 'en-US', 'RU': 'ru-RU' };
            utterance.lang = langMap[languageSelect.value] || 'az-AZ';
            utterance.rate = parseFloat(speedRange.value) || 1.0;

            utterance.onstart = () => {
                ankaBirdContainer.classList.add('speaking-active');
            };

            utterance.onend = () => {
                ankaBirdContainer.classList.remove('speaking-active');
                isAiSpeaking = false;
                if (isLiveMode) {
                    userInput.value = '';
                    startListening();
                }
            };

            utterance.onerror = () => {
                ankaBirdContainer.classList.remove('speaking-active');
                isAiSpeaking = false;
                setPortalState('error');
                if (isLiveMode) {
                    startListening();
                }
            };

            window.speechSynthesis.speak(utterance);
        }

        imageInput.addEventListener('change', (e) => {
            const file = e.target.files[0];
            if (file) {
                infoText.textContent = `📎 ${file.name}`;
                const reader = new FileReader();
                reader.onload = function(uploadEvent) {
                    selectedImageBase64 = uploadEvent.target.result.split(',')[1];
                    selectedImageMimeType = file.type;
                };
                reader.readAsDataURL(file);
            }
        });

        if (micBtn && recognition) {
            micBtn.addEventListener('click', () => {
                startListening();
                infoText.textContent = '🎤 Dinlənilir...';
            });
        }

        async function sendMessage() {
            const text = userInput.value.trim();
            if (!text && !selectedImageBase64) return;

            let userParts = [];
            if (text) {
                userParts.push({ text: text });
            }
            if (selectedImageBase64) {
                userParts.push({
                    inlineData: {
                        mimeType: selectedImageMimeType,
                        data: selectedImageBase64
                    }
                });
            }

            let displayHtml = text ? escapeHtml(text) : '';
            if (selectedImageBase64) {
                displayHtml += `<br><img src="data:${selectedImageMimeType};base64,${selectedImageBase64}" />`;
            }

            appendMessageDiv('Siz', displayHtml, 'user-message');
            chatHistory.push({ role: "user", parts: userParts });

            userInput.value = '';
            selectedImageBase64 = null;
            selectedImageMimeType = null;
            imageInput.value = '';
            infoText.textContent = '';

            if (isLiveMode) {
                liveSpeechText.textContent = 'Anka Qusu düşünür... 🤔';
                setPortalState('thinking');
                stopListening();
            }

            try {
                const response = await fetch('/api/chat', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ 
                        contents: chatHistory,
                        language: languageSelect.value 
                    })
                });

                const data = await response.json();

                if (!response.ok) {
                    throw new Error(data.error?.message || 'Xəta baş verdi.');
                }

                const aiResponseText = data.candidates?.[0]?.content?.parts?.[0]?.text || "Xəta baş verdi.";
                
                // Harf-harf yazı maşını effekti ilə mesajı əlavə edirik
                appendTypewriterMessage('STORMX AI', aiResponseText, 'ai-message');
                chatHistory.push({ role: "model", parts: [{ text: aiResponseText }] });

                if (isLiveMode) {
                    speakText(aiResponseText);
                }

            } catch (err) {
                chatHistory.pop();
                const errText = 'Xəta baş verdi. Yenidən cəhd edin.';
                appendTypewriterMessage('STORMX AI', errText, 'ai-message');
                if (isLiveMode) {
                    setPortalState('error');
                    speakText(errText);
                }
            }
        }

        function appendMessageDiv(sender, htmlContent, className) {
            const msgDiv = document.createElement('div');
            msgDiv.className = `message ${className}`;
            msgDiv.innerHTML = `<div class="message-sender">${sender}</div>${htmlContent}`;
            chatContainer.appendChild(msgDiv);
            chatContainer.scrollTop = chatContainer.scrollHeight;
        }

        // Yazı maşını (Typewriter) effekti funksiyası
        function appendTypewriterMessage(sender, text, className) {
            const msgDiv = document.createElement('div');
            msgDiv.className = `message ${className}`;
            msgDiv.innerHTML = `<div class="message-sender">${sender}</div><span class="text-content"></span>`;
            chatContainer.appendChild(msgDiv);
            
            const textSpan = msgDiv.querySelector('.text-content');
            let i = 0;
            const speed = 15; // Hər hərfin yazılma sürəti (milisaniyə)

            function typeWriter() {
                if (i < text.length) {
                    textSpan.textContent += text.charAt(i);
                    i++;
                    chatContainer.scrollTop = chatContainer.scrollHeight;
                    setTimeout(typeWriter, speed);
                }
            }
            typeWriter();
        }

        function escapeHtml(text) {
            return text
                .replace(/&/g, "&amp;")
                .replace(/</g, "&lt;")
                .replace(/>/g, "&gt;");
        }

        sendBtn.addEventListener('click', sendMessage);
        userInput.addEventListener('keypress', (e) => {
            if (e.key === 'Enter') {
                sendMessage();
            }
        });
    </script>
</body>
</html>
