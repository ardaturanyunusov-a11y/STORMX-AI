<!DOCTYPE html>
<html lang="az">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>JARVIS // STARK INDUSTRIES</title>
    <style>
        *, *::before, *::after {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }
        body {
            background-color: #080302;
            color: #ffb700;
            font-family: 'Courier New', Courier, monospace;
            height: 100vh;
            overflow: hidden;
            display: grid;
            grid-template-rows: auto 1fr auto;
            grid-template-columns: 280px 1fr;
            gap: 15px;
            padding: 20px;
            background-image: 
                radial-gradient(circle at 50% 50%, rgba(255, 123, 0, 0.05) 0%, rgba(8, 3, 2, 0.98) 100%),
                linear-gradient(rgba(255, 183, 0, 0.02) 1px, transparent 1px),
                linear-gradient(90deg, rgba(255, 183, 0, 0.02) 1px, transparent 1px);
            background-size: 100% 100%, 20px 20px, 20px 20px;
        }

        /* Header */
        header {
            grid-column: 1 / -1;
            display: flex;
            justify-content: space-between;
            align-items: center;
            border-bottom: 2px solid rgba(255, 183, 0, 0.4);
            padding-bottom: 12px;
        }
        .logo {
            font-size: 1.5rem;
            font-weight: bold;
            letter-spacing: 3px;
            color: #ffb700;
            text-shadow: 0 0 12px rgba(255, 183, 0, 0.6);
        }
        .header-badges {
            display: flex;
            gap: 15px;
        }
        .status-badge {
            font-size: 0.8rem;
            background: rgba(255, 183, 0, 0.1);
            border: 1px solid #ffb700;
            padding: 5px 12px;
            border-radius: 4px;
            text-transform: uppercase;
            letter-spacing: 1px;
            color: #ffb700;
        }

        /* Sidebar */
        aside {
            background: rgba(30, 10, 0, 0.4);
            border: 1px solid rgba(255, 183, 0, 0.3);
            border-radius: 8px;
            padding: 15px;
            display: flex;
            flex-direction: column;
            gap: 15px;
        }
        .sidebar-title {
            font-size: 0.85rem;
            text-transform: uppercase;
            border-bottom: 1px dashed rgba(255, 183, 0, 0.3);
            padding-bottom: 6px;
            letter-spacing: 1px;
            color: #ffcc33;
        }
        .metric-card {
            background: rgba(255, 183, 0, 0.03);
            border: 1px solid rgba(255, 183, 0, 0.2);
            padding: 10px;
            border-radius: 5px;
        }
        .metric-label {
            font-size: 0.7rem;
            color: rgba(255, 183, 0, 0.7);
        }
        .metric-value {
            font-size: 1rem;
            font-weight: bold;
            margin-top: 4px;
            color: #ffb700;
        }

        /* Main HUD Workspace */
        main {
            background: rgba(20, 5, 0, 0.5);
            border: 1px solid rgba(255, 183, 0, 0.4);
            border-radius: 8px;
            padding: 20px;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
            position: relative;
            overflow: hidden;
            box-shadow: inset 0 0 25px rgba(255, 183, 0, 0.05);
        }

        .visualizer-container {
            display: flex;
            justify-content: center;
            align-items: center;
            margin-bottom: 10px;
        }
        .visualizer {
            width: 120px;
            height: 120px;
            border: 3px dashed rgba(255, 183, 0, 0.5);
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            position: relative;
            animation: rotate 12s linear infinite;
            box-shadow: 0 0 15px rgba(255, 123, 0, 0.2);
        }
        .visualizer-inner {
            width: 85px;
            height: 85px;
            background: rgba(255, 183, 0, 0.1);
            border-radius: 50%;
            box-shadow: 0 0 20px rgba(255, 183, 0, 0.4);
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 1rem;
            font-weight: bold;
            letter-spacing: 2px;
            color: #ffb700;
            transition: background 0.3s ease;
        }
        @keyframes rotate {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }

        .output-box {
            width: 100%;
            height: 140px;
            background: rgba(10, 3, 0, 0.8);
            border: 1px solid rgba(255, 183, 0, 0.4);
            border-radius: 6px;
            padding: 15px;
            overflow-y: auto;
            font-size: 0.95rem;
            line-height: 1.4;
            box-shadow: inset 0 0 10px rgba(0, 0, 0, 0.9);
            margin-bottom: 15px;
            color: #ffe58f;
        }

        .control-panel {
            display: flex;
            gap: 12px;
            align-items: center;
        }
        .chat-input {
            flex: 1;
            background: rgba(30, 10, 0, 0.8);
            border: 1px solid rgba(255, 183, 0, 0.4);
            border-radius: 5px;
            padding: 12px 15px;
            color: #ffb700;
            font-family: 'Courier New', Courier, monospace;
            font-size: 0.95rem;
            outline: none;
            transition: all 0.3s ease;
        }
        .chat-input:focus {
            border-color: #ffb700;
            box-shadow: 0 0 12px rgba(255, 183, 0, 0.4);
        }
        .hud-btn {
            background: rgba(255, 183, 0, 0.15);
            color: #ffb700;
            border: 1px solid #ffb700;
            padding: 12px 20px;
            font-family: 'Courier New', Courier, monospace;
            font-weight: bold;
            border-radius: 5px;
            cursor: pointer;
            transition: all 0.3s ease;
            text-transform: uppercase;
            box-shadow: 0 0 10px rgba(255, 183, 0, 0.2);
            letter-spacing: 1px;
        }
        .hud-btn:hover {
            background: rgba(255, 183, 0, 0.35);
            box-shadow: 0 0 20px rgba(255, 183, 0, 0.6);
        }
        .hud-btn.active {
            background: #ff2a00;
            border-color: #ff2a00;
            color: #fff;
            box-shadow: 0 0 20px rgba(255, 42, 0, 0.8);
        }

        /* Footer */
        footer {
            grid-column: 1 / -1;
            display: flex;
            justify-content: space-between;
            font-size: 0.75rem;
            color: rgba(255, 183, 0, 0.5);
            border-top: 1px solid rgba(255, 183, 0, 0.2);
            padding-top: 8px;
        }
    </style>
</head>
<body>

    <header>
        <div class="logo">J.A.R.V.I.S. // STARK</div>
        <div class="status-badge" id="statusBadge">SYSTEM ONLINE</div>
        <div class="header-badges">
            <div class="status-badge">MARK LXXXV</div>
            <div class="status-badge">SECURE_LINK</div>
        </div>
    </header>

    <aside>
        <div class="sidebar-title">SYSTEM MODULES</div>
        <div class="metric-card">
            <div class="metric-label">ARC REACTOR</div>
            <div class="metric-value" style="color: #ffb700;">100% STABLE</div>
        </div>
        <div class="metric-card">
            <div class="metric-label">VOICE RECOGNITION (AZ)</div>
            <div class="metric-value" id="micStatusIndicator" style="color: #ff2a00;">STANDBY</div>
        </div>
        <div class="metric-card">
            <div class="metric-label">DIAGNOSTICS</div>
            <div class="metric-value">ALL CLEAR</div>
        </div>

        <div class="sidebar-title" style="margin-top: 10px;">QUICK COMMANDS</div>
        <button class="hud-btn" style="width: 100%; font-size: 0.8rem; padding: 8px;" onclick="sendQuickPrompt('Sistem statusunu yoxla')">Check Status</button>
        <button class="hud-btn" style="width: 100%; font-size: 0.8rem; padding: 8px;" onclick="sendQuickPrompt('Kiməsən sən?')">Protocol Info</button>
    </aside>

    <main>
        <div class="visualizer-container">
            <div class="visualizer">
                <div class="visualizer-inner" id="vizText">AI</div>
            </div>
        </div>

        <div class="output-box" id="outputBox">
            Salam cənab Stark. J.A.R.V.I.S. sistemləri tam aktivdir. Əmrlərinizi gözləyirəm.
        </div>

        <div class="control-panel">
            <input type="text" id="userInput" class="chat-input" placeholder="Əmr daxil edin..." autocomplete="off">
            <button class="hud-btn" id="sendBtn">Göndər</button>
            <button class="hud-btn" id="micBtn">Dinlə</button>
            <button class="hud-btn" id="speakBtn">Oxu</button>
        </div>
    </main>

    <footer>
        <div>STARK INDUSTRIES &copy; 2026</div>
        <div>MARK LXXXV INTERFACE</div>
    </footer>

    <script>
        const outputBox = document.getElementById('outputBox');
        const userInput = document.getElementById('userInput');
        const sendBtn = document.getElementById('sendBtn');
        const micBtn = document.getElementById('micBtn');
        const speakBtn = document.getElementById('speakBtn');
        const statusBadge = document.getElementById('statusBadge');
        const micStatusIndicator = document.getElementById('micStatusIndicator');
        const vizText = document.getElementById('vizText');

        let recognition = null;
        let isListening = false;
        let lastResponseText = "Salam cənab Stark. J.A.R.V.I.S. sistemləri tam aktivdir.";

        function speakText(text) {
            if ('speechSynthesis' in window) {
                window.speechSynthesis.cancel();
                const utterance = new SpeechSynthesisUtterance(text);
                utterance.lang = 'az-AZ';
                utterance.rate = 1.0;
                utterance.pitch = 1.0;
                window.speechSynthesis.speak(utterance);
            }
        }

        if ('webkitSpeechRecognition' in window || 'SpeechRecognition' in window) {
            const SpeechRecognition = window.SpeechRecognition || window.webkitSpeechRecognition;
            recognition = new SpeechRecognition();
            recognition.lang = 'az-AZ';
            recognition.interimResults = false;
            recognition.maxAlternatives = 1;

            recognition.onstart = function() {
                isListening = true;
                statusBadge.innerText = 'LISTENING...';
                micStatusIndicator.innerText = 'ACTIVE';
                micStatusIndicator.style.color = '#ff2a00';
                micBtn.classList.add('active');
                micBtn.innerText = 'Stop';
                vizText.style.background = 'rgba(255, 42, 0, 0.4)';
            };

            recognition.onresult = function(event) {
                const speechResult = event.results[0][0].transcript;
                outputBox.innerText = `Siz dediniz: "${speechResult}"`;
                processAIResponse(speechResult);
            };

            recognition.onerror = function(event) {
                statusBadge.innerText = 'ERROR';
                stopListening();
            };

            recognition.onend = function() {
                stopListening();
            };
        } else {
            statusBadge.innerText = 'NO SPEECH SUPPORT';
            micBtn.disabled = true;
        }

        function startListening() {
            if (recognition && !isListening) {
                try {
                    recognition.start();
                } catch(e) {
                    console.error(e);
                }
            }
        }

        function stopListening() {
            isListening = false;
            statusBadge.innerText = 'SYSTEM ONLINE';
            micStatusIndicator.innerText = 'STANDBY';
            micStatusIndicator.style.color = '#ff2a00';
            micBtn.classList.remove('active');
            micBtn.innerText = 'Dinlə';
            vizText.style.background = 'rgba(255, 183, 0, 0.1)';
        }

        micBtn.addEventListener('click', () => {
            if (isListening) {
                recognition.stop();
                stopListening();
            } else {
                startListening();
            }
        });

        function processAIResponse(inputText) {
            const query = inputText.toLowerCase();
            let response = "";

            if (query.includes('necəsən') || query.includes('neçəsən')) {
                response = "Bütün sistemlər əla işləyir, cənab.";
            } else if (query.includes('adın nədir')) {
                response = "Mənim adım J.A.R.V.I.S., Stark Sənayesinin süni intellekt köməkçisiyəm.";
            } else if (query.includes('status')) {
                response = "Ark reaktoru stabildir, təhlükəsizlik səviyyəsi maksimumdur.";
            } else {
                response = `"${inputText}" əmriniz qəbul olundu, cənab.`;
            }

            lastResponseText = response;
            setTimeout(() => {
                outputBox.innerText = response;
                speakText(response);
            }, 400);
        }

        function handleSend() {
            const text = userInput.value.trim();
            if (text !== "") {
                outputBox.innerText = `Siz yazdınız: "${text}"`;
                userInput.value = "";
                processAIResponse(text);
            }
        }

        function sendQuickPrompt(promptText) {
            outputBox.innerText = `Siz yazdınız: "${promptText}"`;
            processAIResponse(promptText);
        }

        sendBtn.addEventListener('click', handleSend);
        userInput.addEventListener('keypress', (e) => {
            if (e.key === 'Enter') {
                handleSend();
            }
        });

        speakBtn.addEventListener('click', () => {
            speakText(outputBox.innerText);
        });
    </script>
</body>
</html>
