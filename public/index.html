<!DOCTYPE html>
<html lang="az">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Agent Console</title>
<style>
  @import url('https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;500;700&family=Source+Serif+4:opsz,wght@8..60,400;8..60,600&display=swap');

  :root{
    --ink:#12141a;
    --panel:#191c24;
    --line:#2c313d;
    --text:#e9e7df;
    --text-dim:#9a9fae;
    --signal:#e8a33d;
    --ok:#5fd0a3;
    --err:#e2685f;
  }
  *{box-sizing:border-box;}
  html,body{height:100%;}
  body{
    margin:0;
    background:
      radial-gradient(circle at 15% 0%, rgba(232,163,61,0.06), transparent 40%),
      var(--ink);
    color:var(--text);
    font-family:'JetBrains Mono', monospace;
    display:flex;
    flex-direction:column;
    min-height:100vh;
  }
  header{
    padding:22px 28px 18px;
    border-bottom:1px solid var(--line);
    display:flex;
    align-items:baseline;
    justify-content:space-between;
  }
  .brand .mark{
    font-family:'Source Serif 4', serif;
    font-weight:600;
    font-size:22px;
    color:var(--text);
  }
  .brand .mark span{color:var(--signal);}
  .status{
    font-size:11px;
    letter-spacing:0.06em;
    text-transform:uppercase;
    display:flex;
    align-items:center;
    gap:7px;
    color:var(--text-dim);
  }
  .dot{width:7px;height:7px;border-radius:50%; background:var(--ok); box-shadow:0 0 8px var(--ok);}

  main.chat{
    flex:1;
    display:flex;
    flex-direction:column;
    max-width:760px;
    width:100%;
    margin:0 auto;
    padding:24px 20px 0;
  }
  .msgs{
    flex:1;
    overflow-y:auto;
    padding-bottom:20px;
    display:flex;
    flex-direction:column;
    gap:16px;
  }
  .empty-hint{
    color:var(--text-dim);
    font-size:12.5px;
    line-height:1.8;
    padding:30px 4px;
    border-left:2px solid var(--line);
    padding-left:16px;
  }
  .msg{display:flex; gap:12px; align-items:flex-start;}
  .msg .role{
    font-size:10px; letter-spacing:0.08em; text-transform:uppercase;
    color:var(--text-dim); width:52px; flex-shrink:0; padding-top:3px; text-align:right;
  }
  .msg.user .role{color:var(--signal);}
  .msg .bubble{
    font-family:'Source Serif 4', serif; font-size:15px; line-height:1.65;
    color:var(--text); white-space:pre-wrap; padding-top:1px;
  }
  .msg.err .bubble{color:var(--err); font-family:'JetBrains Mono', monospace; font-size:12.5px;}
  .typing{display:flex; gap:4px; padding-top:6px;}
  .typing span{width:5px;height:5px;border-radius:50%; background:var(--text-dim); animation:pulse 1.1s infinite ease-in-out;}
  .typing span:nth-child(2){animation-delay:.15s;}
  .typing span:nth-child(3){animation-delay:.3s;}
  @keyframes pulse{0%,80%,100%{opacity:.25; transform:scale(.8);} 40%{opacity:1; transform:scale(1);}}

  .composer{
    border-top:1px solid var(--line);
    padding:16px 0 22px;
    display:flex;
    gap:10px;
    align-items:flex-end;
  }
  textarea{
    flex:1;
    background:var(--panel);
    border:1px solid var(--line);
    color:var(--text);
    font-family:'Source Serif 4', serif;
    font-size:14.5px;
    padding:12px 14px;
    border-radius:4px;
    outline:none;
    resize:none;
    max-height:160px;
    line-height:1.5;
  }
  textarea:focus{border-color:#8a6329;}
  button{
    font-family:'JetBrains Mono', monospace;
    font-size:12.5px;
    letter-spacing:0.03em;
    text-transform:uppercase;
    background:var(--signal);
    color:#171308;
    border:none;
    padding:12px 20px;
    border-radius:3px;
    cursor:pointer;
    font-weight:700;
  }
  button:disabled{opacity:0.4; cursor:not-allowed;}
  ::-webkit-scrollbar{width:8px;}
  ::-webkit-scrollbar-thumb{background:var(--line); border-radius:4px;}
</style>
</head>
<body>

<header>
  <div class="brand"><div class="mark">agent<span>.</span>console</div></div>
  <div class="status"><span class="dot"></span><span>Hazır</span></div>
</header>

<main class="chat">
  <div class="msgs" id="msgs">
    <div class="empty-hint" id="emptyHint">Agent hazırdır. Heç bir giriş lazım deyil — sadəcə yazın. Enter göndərir, Shift+Enter yeni sətir açır.</div>
  </div>
  <div class="composer">
    <textarea id="input" rows="1" placeholder="Mesaj yazın..."></textarea>
    <button id="sendBtn">Göndər</button>
  </div>
</main>

<script>
let history = [];
const msgsEl = document.getElementById('msgs');
const input = document.getElementById('input');
const sendBtn = document.getElementById('sendBtn');

function addMessage(role, text, isError=false){
  const hint = document.getElementById('emptyHint');
  if(hint) hint.remove();
  const row = document.createElement('div');
  row.className = 'msg ' + (role === 'user' ? 'user' : 'model') + (isError ? ' err' : '');
  const roleLabel = document.createElement('div');
  roleLabel.className = 'role';
  roleLabel.textContent = role === 'user' ? 'siz' : (isError ? 'xəta' : 'agent');
  const bubble = document.createElement('div');
  bubble.className = 'bubble';
  bubble.textContent = text;
  row.appendChild(roleLabel);
  row.appendChild(bubble);
  msgsEl.appendChild(row);
  msgsEl.scrollTop = msgsEl.scrollHeight;
}

function addTyping(){
  const row = document.createElement('div');
  row.className = 'msg model';
  row.id = 'typingRow';
  const roleLabel = document.createElement('div');
  roleLabel.className = 'role';
  roleLabel.textContent = 'agent';
  const typing = document.createElement('div');
  typing.className = 'typing';
  typing.innerHTML = '<span></span><span></span><span></span>';
  row.appendChild(roleLabel);
  row.appendChild(typing);
  msgsEl.appendChild(row);
  msgsEl.scrollTop = msgsEl.scrollHeight;
}
function removeTyping(){ const el = document.getElementById('typingRow'); if(el) el.remove(); }

input.addEventListener('input', () => {
  input.style.height = 'auto';
  input.style.height = Math.min(input.scrollHeight, 160) + 'px';
});
input.addEventListener('keydown', (e) => {
  if(e.key === 'Enter' && !e.shiftKey){ e.preventDefault(); sendMessage(); }
});
sendBtn.addEventListener('click', sendMessage);

async function sendMessage(){
  const text = input.value.trim();
  if(!text) return;

  addMessage('user', text);
  history.push({role:'user', parts:[{text}]});
  input.value = '';
  input.style.height = 'auto';
  sendBtn.disabled = true;
  addTyping();

  try{
    const resp = await fetch('/api/chat', {
      method: 'POST',
      headers: {'Content-Type': 'application/json'},
      body: JSON.stringify({ contents: history })
    });
    const data = await resp.json();
    removeTyping();

    if(!resp.ok){
      addMessage('model', 'Sorğu uğursuz oldu: ' + (data.error || resp.status), true);
      return;
    }

    addMessage('model', data.reply);
    history.push({role:'model', parts:[{text: data.reply}]});

  }catch(err){
    removeTyping();
    addMessage('model', 'Şəbəkə xətası: ' + err.message, true);
  }finally{
    sendBtn.disabled = false;
    input.focus();
  }
}
</script>

</body>
</html>
