<!DOCTYPE html>
<html lang="az">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>STORMX AI - Anka Qusu Live</title>
    <style>
        body {
            background-color: #0b0f19;
            color: #ffffff;
            font-family: Arial, sans-serif;
            margin: 0;
            padding: 0;
            display: flex;
            flex-direction: column;
            height: 100vh;
            overflow: hidden;
        }
        header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 15px 20px;
            background-color: #111827;
            border-bottom: 1px solid #1f2937;
            z-index: 10;
        }
        .logo-area {
            display: flex;
            align-items: center;
            gap: 12px;
        }
        .logo {
            color: #f59e0b;
            font-weight: bold;
            font-size: 1.2rem;
            letter-spacing: 1px;
        }
        .header-controls {
            display: flex;
            align-items: center;
            gap: 12px;
        }
        select {
            background-color: #1f2937;
            color: #ffffff;
            border: 1px solid #374151;
            padding: 6px 12px;
            border-radius: 6px;
            outline: none;
            cursor: pointer;
            font-weight: bold;
        }
        .live-btn {
            background-color: #1f2937;
            color: #ef4444;
            border: 1px solid #374151;
            padding: 6px 12px;
            border-radius: 6px;
            cursor: pointer;
            font-weight: bold;
            font-size: 0.85rem;
            transition: all 0.2s;
        }
        .live-btn.active {
            background-color: #22c55e;
            color: #ffffff;
            border-color: #22c55e;
            box-shadow: 0 0 15px rgba(34, 197, 94, 0.6);
        }
        .status-badge {
            background-color: #1f2937;
            color: #f59e0b;
            padding: 6px 14px;
            border-radius: 20px;
            font-size: 0.9rem;
            display: flex;
            align-items: center;
            gap: 6px;
            border: 1px solid #374151;
            font-weight: bold;
        }
        .status-dot {
            width: 8px;
            height: 8px;
            background-color: #f59e0b;
            border-radius: 50%;
        }

        /* Əsas Chat Ekranı */
        .chat-container {
            flex: 1;
            overflow-y: auto;
            padding: 20px;
            display: flex;
            flex-direction: column;
            gap: 15px;
        }
        .message {
            max-width: 80%;
            padding: 12px 16px;
            border-radius: 12px;
            line-height: 1.5;
            word-break: break-word;
        }
        .ai-message {
            background-color: #161e2e;
            color: #e5e7eb;
            align-self: flex-start;
            border: 1px solid #1f2937;
        }
        .user-message {
            background-color: #1f2937;
            color: #ffffff;
            align-self: flex-end;
            border: 1px solid #374151;
        }
        .message-sender {
            font-size: 0.75rem;
            color: #9ca3af;
            margin-bottom: 4px;
            text-transform: uppercase;
        }
        .message img {
            max-width: 100%;
            border-radius: 8px;
            margin-top: 8px;
        }

        /* LIVE QAPI ŞÜŞƏSİ VƏ ANKA QUSU PORTALI */
        .live-overlay {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(11, 15, 25, 0.88);
            backdrop-filter: blur(12px);
            z-index: 100;
            display: flex;
            justify-content: center;
            align-items: center;
            animation: dropFromSky 0.5s cubic-bezier(0.175, 0.885, 0.32, 1.275) forwards;
        }

        @keyframes dropFromSky {
            0% { opacity: 0; transform: translateY(-80px) scale(0.9); }
            100% { opacity: 1; transform: translateY(0) scale(1); }
        }

        .glass-portal {
            width: 90%;
            max-width: 600px;
            background: linear-gradient(145deg, rgba(31, 41, 55, 0.7), rgba(15, 23, 42, 0.9));
            border: 2px solid rgba(245, 158, 11, 0.5);
            box-shadow: 0 25px 60px rgba(0, 0, 0, 0.9), 0 0 35px rgba(245, 158, 11, 0.3);
            border-radius: 24px;
            padding: 40px 30px;
            display: flex;
            flex-direction: column;
            align-items: center;
            text-align: center;
            position: relative;
        }

        .anka-bird-container {
            width: 140px;
            height: 140px;
            border-radius: 50%;
            background: radial-gradient(circle, rgba(245, 158, 11, 0.3) 0%, rgba(239, 68, 68, 0.2) 70%, transparent 100%);
            display: flex;
            justify-content: center;
            align-items: center;
            position: relative;
            margin-bottom: 25px;
            border: 2px solid #f59e0b;
            box-shadow: 0 0 25px rgba(245, 158, 11, 0.5);
            animation: floatBird 3s ease-in-out infinite;
        }

        @keyframes floatBird {
            0%, 100% { transform: translateY(0); }
            50% { transform: translateY(-10px); }
        }

        .anka-emoji {
            font-size: 4rem;
            transition: transform 0.2s;
        }

        .anka-bird-container.speaking-active .anka-emoji {
            animation: talkMouth 0.25s infinite alternate ease-in-out;
        }

        @keyframes talkMouth {
            0% { transform: scale(1) rotate(-3deg); }
            100% { transform: scale(1.18) rotate(3deg); filter: drop-shadow(0 0 12px #ef4444); }
        }

        .live-title {
            color: #f59e0b;
            font-size: 1.4rem;
            font-weight: bold;
            margin-bottom: 15px;
            letter-spacing: 1px;
        }

        .live-speech-bubble {
            background-color: rgba(17, 24, 39, 0.95);
            border: 1px solid #374151;
            padding: 20px;
            border-radius: 16px;
            color: #e5e7eb;
            font-size: 1.1rem;
            min-height: 70px;
            width: 100%;
            box-sizing: border-box;
            display: flex;
            align-items: center;
            justify-content: center;
            margin-bottom: 20px;
            line-height: 1.5;
        }

        .mic-status-indicator {
            font-size: 0.9rem;
            color: #22c55e;
            font-weight: bold;
            margin-bottom: 20px;
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .close-live-btn {
            background-color: #ef4444;
            color: #ffffff;
            border: none;
            padding: 10px 30px;
            border-radius: 12px;
            font-weight: bold;
            cursor: pointer;
            font-size: 1rem;
            transition: background-color 0.2s;
        }
        .close-live-btn:hover {
            background-color: #dc2626;
        }

        /* Mesaj yazma paneli */
        .input-container {
            padding: 15px 20px;
            background-color: #111827;
            border-top: 1px solid #1f2937;
            display: flex;
            gap: 10px;
            align-items: center;
            z-index: 10;
        }
        input[type="text"] {
            flex: 1;
            background-color: #1f2937;
            border: 1px solid #374151;
            padding: 12px 15px;
            border-radius: 8px;
            color: #ffffff;
            outline: none;
            font-size: 1rem;
        }
        input[type="text"]::placeholder {
            color: #9ca3af;
        }
        .tool-btn {
            background-color: #1f2937;
            color: #f59e0b;
            border: 1px solid #374151;
            padding: 10px 14px;
            border-radius: 8px;
            cursor: pointer;
            font-size: 1.1rem;
            transition: background-color 0.2s;
        }
        .tool-btn:hover {
            background-color: #374151;
        }
        button.send-btn {
            background-color: #f59e0b;
            color: #0b0f19;
            border: none;
            padding: 0 25px;
            height: 45px;
            border-radius: 8px;
            font-weight: bold;
            cursor: pointer;
            transition: background-color 0.2s;
        }
        button.send-btn:hover {
            background-color: #d97706;
        }
        #infoText {
            font-size: 0.8rem;
            color: #f59e0b;
            margin-left: 5px;
        }
    </style>
</head>
<body>

    <header>
        <div class="logo-area">
            <div class="logo">STORMX AI</div>
        </div>
        <div class="header-controls">
            <button id="liveBtn" class="live-btn">🔴 LIVE</button>
            <select id="languageSelect">
                <option value="AZ">AZ</option>
                <option value="EN">EN</option>
                <option value="RU">RU</option>
            </select>
            <div class="status-badge">
                <div class="status-dot"></div> HAZIR
            </div>
        </div>
    </header>

    <!-- Normal Chat Ekranı -->
    <div class="chat-container" id="chatContainer">
        <div class="message ai-message">
            <div class="message-sender">STORMX AI</div>
            Salam! Mən STORMX AI-yam. LIVE düyməsinə basaraq Anka Qusunun canlı qapı portalını aça bilərsən!
        </div>
    </div>

    <!-- LIVE QAPI ŞÜŞƏSİ VƏ ANKA QUSU EKRANI -->
    <div id="liveOverlay" class="live-overlay" style="display: none;">
        <div class="glass-portal">
            <div id="ankaBirdContainer" class="anka-bird-container">
                <span class="anka-emoji">🦅</span>
            </div>
            <div class="live-title">ANKA QUSU - LIVE PORTAL</div>
            <div id="liveSpeechText" class="live-speech-bubble">
                Salam! Mən Anka Qusuyam. Səni dinləyirəm, buyur danış...
            </div>
            <div id="micStatusIndicator" class="mic-status-indicator">
                🎤 Mikrofon aktivdir, səslə danışa bilərsən...
            </div>
            <button class="close-live-btn" id="closeLiveBtn">LIVE-I BAĞLA</button>
        </div>
    </div>

    <div class="input-container">
        <input type="file" id="imageInput" accept="image/*" style="display: none;">
        <button class="tool-btn" onclick="document.getElementById('imageInput').click()" title="Şəkil yüklə">📷</button>
        <button class="tool-btn" id="micBtn" title="Səslə danış">🎤</button>
        <span id="infoText"></span>
        <input type="text" id="userInput" placeholder="Mesaj yazın və ya səslə danışın...">
        <button class="send-btn" id="sendBtn">GÖNDƏR</button>
    </div>

    <script>
        const chatContainer = document.getElementById('chatContainer');
        const userInput = document.getElementById('userInput');
        const sendBtn = document.getElementById('sendBtn');
        const languageSelect = document.getElementById('languageSelect');
        const imageInput = document.getElementById('imageInput');
        const micBtn = document.getElementById('micBtn');
        const liveBtn = document.getElementById('liveBtn');
        const liveOverlay = document.getElementById('liveOverlay');
        const closeLiveBtn = document.getElementById('closeLiveBtn');
        const liveSpeechText = document.getElementById('liveSpeechText');
        const micStatusIndicator = document.getElementById('micStatusIndicator');
        const ankaBirdContainer = document.getElementById('ankaBirdContainer');
        const infoText = document.getElementById('infoText');

        let chatHistory = [];
        let selectedImageBase64 = null;
        let selectedImageMimeType = null;
        let isLiveMode = false;
        let recognition = null;
        let isAiSpeaking = false;

        // Səs tanıma sistemini quraşdırırıq
        if ('webkitSpeechRecognition' in window || 'SpeechRecognition' in window) {
            const SpeechRecognition = window.SpeechRecognition || window.webkitSpeechRecognition;
            recognition = new SpeechRecognition();
            recognition.continuous = true; // Fasiləsiz dinləmə
            recognition.interimResults = true;

            recognition.onresult = (event) => {
                if (isAiSpeaking) return; // Əgər Anka Qusu danırsa, mikrofon səsimizi nəzərə almasın
                let transcript = '';
                for (let i = event.resultIndex; i < event.results.length; i++) {
                    transcript += event.results[i][0].transcript;
                }
                userInput.value = transcript;
                if (isLiveMode) {
                    liveSpeechText.textContent = `Siz: "${transcript}"`;
                }
            };

            recognition.onerror = () => {
                // Xəta olduqda yenidən başlatmağa çalışırıq
                if (isLiveMode && !isAiSpeaking) {
                    try { recognition.start(); } catch(e) {}
                }
            };

            recognition.onend = () => {
                // Əgər live rejimi hələ aktivdirsə və AI danışmırsa, mikrofonu dərhal avtomatik yenidən açırıq
                if (isLiveMode && !isAiSpeaking) {
                    try { recognition.start(); } catch(e) {}
                }
            };
        }

        function startListening() {
            if (!recognition) return;
            try {
                const langMap = { 'AZ': 'az-AZ', 'EN': 'en-US', 'RU': 'ru-RU' };
                recognition.lang = langMap[languageSelect.value] || 'az-AZ';
                recognition.start();
                if (micStatusIndicator) micStatusIndicator.textContent = '🎤 Mikrofon aktivdir, danışın...';
            } catch (e) {
                // Artıq işləyirsə heç nə etmirik
            }
        }

        function stopListening() {
            if (!recognition) return;
            try {
                recognition.stop();
            } catch (e) {}
        }

        // LIVE Rejimi Açmaq
        liveBtn.addEventListener('click', () => {
            isLiveMode = true;
            chatContainer.innerHTML = ''; // Yazışmaları təmizləyirik (görünməz edirik)
            liveOverlay.style.display = 'flex';
            liveBtn.classList.add('active');
            liveBtn.textContent = '🟢 LIVE AKTİV';
            
            startListening();
            speakText("Salam! Mən Anka Qusuyam. Səni dinləyirəm, buyur danış.");
        });

        // LIVE Rejimi Bağlamaq
        closeLiveBtn.addEventListener('click', () => {
            isLiveMode = false;
            stopListening();
            liveOverlay.style.display = 'none';
            liveBtn.classList.remove('active');
            liveBtn.textContent = '🔴 LIVE';
            if ('speechSynthesis' in window) {
                window.speechSynthesis.cancel();
            }
            ankaBirdContainer.classList.remove('speaking-active');
        });

        // Anka Qusunun Səsləndirmə funksiyası (Danışanda mikrofonu müvəqqəti söndürürük)
        function speakText(text) {
            if (!('speechSynthesis' in window)) return;
            window.speechSynthesis.cancel();
            
            isAiSpeaking = true;
            stopListening(); // Öz səsini eşitməməsi üçün mikrofonu dayandırırıq

            liveSpeechText.textContent = text;
            if (micStatusIndicator) micStatusIndicator.textContent = '🦅 Anka Qusu danışır... (dinlənilir)';

            const utterance = new SpeechSynthesisUtterance(text);
            const langMap = { 'AZ': 'az-AZ', 'EN': 'en-US', 'RU': 'ru-RU' };
            utterance.lang = langMap[languageSelect.value] || 'az-AZ';

            utterance.onstart = () => {
                ankaBirdContainer.classList.add('speaking-active');
            };

            utterance.onend = () => {
                ankaBirdContainer.classList.remove('speaking-active');
                isAiSpeaking = false;
                if (isLiveMode) {
                    userInput.value = ''; // Inputu təmizləyirik ki, yeni söz deyə bilək
                    startListening(); // Danışıq bitdi, mikrofonu yenidən açırıq!
                }
            };

            utterance.onerror = () => {
                ankaBirdContainer.classList.remove('speaking-active');
                isAiSpeaking = false;
                if (isLiveMode) {
                    startListening();
                }
            };

            window.speechSynthesis.speak(utterance);
        }

        // Şəkil yükləmə mantığı
        imageInput.addEventListener('change', (e) => {
            const file = e.target.files[0];
            if (file) {
                infoText.textContent = `📎 ${file.name}`;
                const reader = new FileReader();
                reader.onload = function(uploadEvent) {
                    selectedImageBase64 = uploadEvent.target.result.split(',')[1];
                    selectedImageMimeType = file.type;
                };
                reader.readAsDataURL(file);
            }
        });

        // Adi mikrofon düyməsi (Live olmayan rejim üçün)
        if (micBtn && recognition) {
            micBtn.addEventListener('click', () => {
                startListening();
                infoText.textContent = '🎤 Dinlənilir...';
            });
        }

        async function sendMessage() {
            const text = userInput.value.trim();
            if (!text && !selectedImageBase64) return;

            let userParts = [];
            if (text) {
                userParts.push({ text: text });
            }
            if (selectedImageBase64) {
                userParts.push({
                    inlineData: {
                        mimeType: selectedImageMimeType,
                        data: selectedImageBase64
                    }
                });
            }

            let displayHtml = text ? escapeHtml(text) : '';
            if (selectedImageBase64) {
                displayHtml += `<br><img src="data:${selectedImageMimeType};base64,${selectedImageBase64}" />`;
            }

            appendMessageDiv('Siz', displayHtml, 'user-message');
            chatHistory.push({ role: "user", parts: userParts });

            userInput.value = '';
            selectedImageBase64 = null;
            selectedImageMimeType = null;
            imageInput.value = '';
            infoText.textContent = '';

            if (isLiveMode) {
                liveSpeechText.textContent = 'Anka Qusu düşünür... 🤔';
                stopListening(); // Serverə sorğu gedərkən dinləməni dayandırırıq
            }

            try {
                const response = await fetch('/api/chat', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ 
                        contents: chatHistory,
                        language: languageSelect.value 
                    })
                });

                const data = await response.json();

                if (!response.ok) {
                    throw new Error(data.error?.message || 'Xəta baş verdi.');
                }

                const aiResponseText = data.candidates?.[0]?.content?.parts?.[0]?.text || "Xəta baş verdi.";
                
                appendMessageDiv('STORMX AI', escapeHtml(aiResponseText), 'ai-message');
                chatHistory.push({ role: "model", parts: [{ text: aiResponseText }] });

                if (isLiveMode) {
                    speakText(aiResponseText); // Cavabı səsləndiririk və bitən kimi mikrofonu avtomatik açırıq
                }

            } catch (err) {
                chatHistory.pop();
                const errText = 'Xəta baş verdi. Yenidən cəhd edin.';
                appendMessageDiv('STORMX AI', errText, 'ai-message');
                if (isLiveMode) {
                    speakText(errText);
                }
            }
        }

        function appendMessageDiv(sender, htmlContent, className) {
            const msgDiv = document.createElement('div');
            msgDiv.className = `message ${className}`;
            msgDiv.innerHTML = `<div class="message-sender">${sender}</div>${htmlContent}`;
            chatContainer.appendChild(msgDiv);
            chatContainer.scrollTop = chatContainer.scrollHeight;
        }

        function escapeHtml(text) {
            return text
                .replace(/&/g, "&amp;")
                .replace(/</g, "&lt;")
                .replace(/>/g, "&gt;");
        }

        sendBtn.addEventListener('click', sendMessage);
        userInput.addEventListener('keypress', (e) => {
            if (e.key === 'Enter') {
                sendMessage();
            }
        });
    </script>
</body>
</html>
