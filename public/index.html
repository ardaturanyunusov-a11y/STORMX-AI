<!DOCTYPE html>
<html lang="az">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>STORMX AI</title>
    <style>
        body {
            background-color: #0b0f19;
            color: #ffffff;
            font-family: Arial, sans-serif;
            margin: 0;
            padding: 0;
            display: flex;
            flex-direction: column;
            height: 100vh;
        }
        header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 15px 20px;
            background-color: #111827;
            border-bottom: 1px solid #1f2937;
        }
        .logo {
            color: #f59e0b;
            font-weight: bold;
            font-size: 1.2rem;
            letter-spacing: 1px;
        }
        .header-controls {
            display: flex;
            align-items: center;
            gap: 15px;
        }
        select {
            background-color: #1f2937;
            color: #ffffff;
            border: 1px solid #374151;
            padding: 6px 12px;
            border-radius: 6px;
            outline: none;
            cursor: pointer;
            font-weight: bold;
        }
        .status-badge {
            background-color: #1f2937;
            color: #f59e0b;
            padding: 6px 14px;
            border-radius: 20px;
            font-size: 0.9rem;
            display: flex;
            align-items: center;
            gap: 6px;
            border: 1px solid #374151;
            font-weight: bold;
        }
        .status-dot {
            width: 8px;
            height: 8px;
            background-color: #f59e0b;
            border-radius: 50%;
        }
        .chat-container {
            flex: 1;
            overflow-y: auto;
            padding: 20px;
            display: flex;
            flex-direction: column;
            gap: 15px;
        }
        .message {
            max-width: 80%;
            padding: 12px 16px;
            border-radius: 12px;
            line-height: 1.5;
            word-break: break-word;
        }
        .ai-message {
            background-color: #161e2e;
            color: #e5e7eb;
            align-self: flex-start;
            border: 1px solid #1f2937;
        }
        .user-message {
            background-color: #1f2937;
            color: #ffffff;
            align-self: flex-end;
            border: 1px solid #374151;
        }
        .message-sender {
            font-size: 0.75rem;
            color: #9ca3af;
            margin-bottom: 4px;
            text-transform: uppercase;
        }
        .message img {
            max-width: 100%;
            border-radius: 8px;
            margin-top: 8px;
        }
        .input-container {
            padding: 15px 20px;
            background-color: #111827;
            border-top: 1px solid #1f2937;
            display: flex;
            gap: 10px;
            align-items: center;
        }
        input[type="text"] {
            flex: 1;
            background-color: #1f2937;
            border: 1px solid #374151;
            padding: 12px 15px;
            border-radius: 8px;
            color: #ffffff;
            outline: none;
            font-size: 1rem;
        }
        input[type="text"]::placeholder {
            color: #9ca3af;
        }
        .upload-btn {
            background-color: #1f2937;
            color: #f59e0b;
            border: 1px solid #374151;
            padding: 10px 14px;
            border-radius: 8px;
            cursor: pointer;
            font-size: 1.1rem;
            transition: background-color 0.2s;
        }
        .upload-btn:hover {
            background-color: #374151;
        }
        button.send-btn {
            background-color: #f59e0b;
            color: #0b0f19;
            border: none;
            padding: 0 25px;
            height: 45px;
            border-radius: 8px;
            font-weight: bold;
            cursor: pointer;
            transition: background-color 0.2s;
        }
        button.send-btn:hover {
            background-color: #d97706;
        }
        #imagePreviewName {
            font-size: 0.8rem;
            color: #f59e0b;
            margin-left: 5px;
        }
    </style>
</head>
<body>

    <header>
        <div class="logo">STORMX AI</div>
        <div class="header-controls">
            <select id="languageSelect">
                <option value="AZ">AZ</option>
                <option value="EN">EN</option>
                <option value="RU">RU</option>
            </select>
            <div class="status-badge">
                <div class="status-dot"></div> HAZIR
            </div>
        </div>
    </header>

    <div class="chat-container" id="chatContainer">
        <div class="message ai-message">
            <div class="message-sender">STORMX AI</div>
            Salam! Mən STORMX AI-yam. Şəkil yükləyib sual verə bilərsən, sizə necə kömək edə bilərəm?
        </div>
    </div>

    <div class="input-container">
        <input type="file" id="imageInput" accept="image/*" style="display: none;">
        <button class="upload-btn" onclick="document.getElementById('imageInput').click()" title="Şəkil yüklə">📷</button>
        <span id="imagePreviewName"></span>
        <input type="text" id="userInput" placeholder="Mesaj yazın və ya şəkil göndərin...">
        <button class="send-btn" id="sendBtn">GÖNDƏR</button>
    </div>

    <script>
        const chatContainer = document.getElementById('chatContainer');
        const userInput = document.getElementById('userInput');
        const sendBtn = document.getElementById('sendBtn');
        const languageSelect = document.getElementById('languageSelect');
        const imageInput = document.getElementById('imageInput');
        const imagePreviewName = document.getElementById('imagePreviewName');

        let chatHistory = [];
        let selectedImageBase64 = null;
        let selectedImageMimeType = null;

        imageInput.addEventListener('change', (e) => {
            const file = e.target.files[0];
            if (file) {
                imagePreviewName.textContent = `📎 ${file.name}`;
                const reader = new FileReader();
                reader.onload = function(uploadEvent) {
                    const base64String = uploadEvent.target.result.split(',')[1];
                    selectedImageBase64 = base64String;
                    selectedImageMimeType = file.type;
                };
                reader.readAsDataURL(file);
            }
        });

        async function sendMessage() {
            const text = userInput.value.trim();
            if (!text && !selectedImageBase64) return;

            let userParts = [];
            if (text) {
                userParts.push({ text: text });
            }
            if (selectedImageBase64) {
                userParts.push({
                    inlineData: {
                        mimeType: selectedImageMimeType,
                        data: selectedImageBase64
                    }
                });
            }

            let displayHtml = text ? escapeHtml(text) : '';
            if (selectedImageBase64) {
                displayHtml += `<br><img src="data:${selectedImageMimeType};base64,${selectedImageBase64}" />`;
            }

            appendMessageDiv('Siz', displayHtml, 'user-message');
            chatHistory.push({ role: "user", parts: userParts });

            userInput.value = '';
            selectedImageBase64 = null;
            selectedImageMimeType = null;
            imageInput.value = '';
            imagePreviewName.textContent = '';

            try {
                const response = await fetch('/api/chat', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ 
                        contents: chatHistory,
                        language: languageSelect.value 
                    })
                });

                const data = await response.json();

                if (!response.ok) {
                    throw new Error(data.error?.message || 'Xəta baş verdi.');
                }

                const aiResponseText = data.candidates?.[0]?.content?.parts?.[0]?.text || "Xəta baş verdi.";
                
                appendMessageDiv('STORMX AI', escapeHtml(aiResponseText), 'ai-message');
                chatHistory.push({ role: "model", parts: [{ text: aiResponseText }] });

            } catch (err) {
                // Xəta olarsa, səhv olan mesajı tarixçədən silirik ki, sonrakı mesajlar qırılmasın!
                chatHistory.pop();
                appendMessageDiv('STORMX AI', 'Xəta baş verdi. Zəhmət olmasa yenidən cəhd edin.', 'ai-message');
            }
        }

        function appendMessageDiv(sender, htmlContent, className) {
            const msgDiv = document.createElement('div');
            msgDiv.className = `message ${className}`;
            msgDiv.innerHTML = `<div class="message-sender">${sender}</div>${htmlContent}`;
            chatContainer.appendChild(msgDiv);
            chatContainer.scrollTop = chatContainer.scrollHeight;
        }

        function escapeHtml(text) {
            return text
                .replace(/&/g, "&amp;")
                .replace(/</g, "&lt;")
                .replace(/>/g, "&gt;");
        }

        sendBtn.addEventListener('click', sendMessage);
        userInput.addEventListener('keypress', (e) => {
            if (e.key === 'Enter') sendMessage();
        });
    </script>
</body>
</html>
