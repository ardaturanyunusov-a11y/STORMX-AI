<!DOCTYPE html>
<html lang="az">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>STORMX AI</title>
    <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
    <style>
        body {
            background-color: #0b0f19;
            color: #e5e7eb;
            font-family: system-ui, -apple-system, sans-serif;
        }
        .gold-gradient {
            background: linear-gradient(135deg, #bf953f, #fc6, #b38728, #fbf5b7, #aa771c);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }
        .gold-border {
            border-color: rgba(212, 175, 55, 0.3);
        }
        .gold-border:focus {
            border-color: #d4af37;
            box-shadow: 0 0 15px rgba(212, 175, 55, 0.2);
        }
        .gold-btn {
            background: linear-gradient(135deg, #d4af37, #aa771c);
            color: #0b0f19;
            font-weight: bold;
            transition: all 0.3s ease;
        }
        .gold-btn:hover {
            opacity: 0.9;
            box-shadow: 0 0 20px rgba(212, 175, 55, 0.4);
        }
    </style>
</head>
<body class="flex flex-col h-screen justify-between">

    <!-- Header -->
    <header class="flex justify-between items-center px-6 py-4 border-b gold-border bg-[#0f1523]/50 backdrop-blur-md">
        <div class="flex items-center space-x-3">
            <h1 class="text-xl font-black tracking-wider gold-gradient">STORMX AI</h1>
        </div>
        
        <div class="flex items-center space-x-4">
            <!-- Dil Seçimi (Language Selector) -->
            <select id="langSelect" onchange="changeLanguage(this.value)" class="bg-[#131b2e] text-amber-300 border gold-border text-sm rounded-lg px-3 py-1.5 outline-none cursor-pointer">
                <option value="az">AZ</option>
                <option value="ru">RU</option>
                <option value="en">EN</option>
            </select>

            <div class="flex items-center space-x-2 bg-[#131b2e] px-3 py-1 rounded-full border gold-border">
                <span class="w-2 h-2 rounded-full bg-amber-400 animate-pulse"></span>
                <span id="statusText" class="text-xs text-amber-300 font-medium">HAZIR</span>
            </div>
        </div>
    </header>

    <!-- Chat Box -->
    <main id="chatContainer" class="flex-1 overflow-y-auto px-4 py-6 space-y-6 max-w-4xl w-full mx-auto">
        <!-- Mesajlar bura gələcək -->
        <div class="flex flex-col space-y-2">
            <div class="text-xs text-amber-500/70 font-mono">STORMX AI</div>
            <div class="bg-[#131b2e] border gold-border p-4 rounded-2xl max-w-[85%] text-sm leading-relaxed shadow-lg">
                Salam! Mən STORMX AI-yam. Sizə necə kömək edə bilərəm?
            </div>
        </div>
    </main>

    <!-- Input Area -->
    <footer class="p-4 bg-[#0f1523]/80 backdrop-blur-md border-t gold-border">
        <div class="max-w-4xl mx-auto flex gap-3">
            <input type="text" id="userInput" placeholder="Mesaj yazın..." class="flex-1 bg-[#131b2e] border gold-border rounded-xl px-4 py-3 text-sm text-white placeholder-gray-500 outline-none">
            <button onclick="sendMessage()" id="sendBtn" class="gold-btn px-6 py-3 rounded-xl text-sm cursor-pointer">GÖNDƏR</option>
        </div>
    </footer>

    <script>
        const translations = {
            az: { placeholder: "Mesaj yazın...", send: "GÖNDƏR", status: "HAZIR", welcome: "Salam! Mən STORMX AI-yam. Sizə necə kömək edə bilərəm?" },
            ru: { placeholder: "Введите сообщение...", send: "ОТПРАВИТЬ", status: "ГОТОВ", welcome: "Привет! Я STORMX AI. Чем могу помочь?" },
            en: { placeholder: "Type a message...", send: "SEND", status: "READY", welcome: "Hello! I am STORMX AI. How can I help you?" }
        };

        function changeLanguage(lang) {
            const t = translations[lang];
            document.getElementById('userInput').placeholder = t.placeholder;
            document.getElementById('sendBtn').innerText = t.send;
            document.getElementById('statusText').innerText = t.status;
        }

        function sendMessage() {
            const input = document.getElementById('userInput');
            const container = document.getElementById('chatContainer');
            if (!input.value.trim()) return;

            // İstifadəçi mesajı
            container.innerHTML += `
                <div class="flex flex-col space-y-1 items-end">
                    <div class="text-xs text-gray-500 font-mono">SİZ</div>
                    <div class="bg-amber-500/10 border gold-border p-3.5 rounded-2xl max-w-[85%] text-sm leading-relaxed text-amber-100">${input.value}</div>
                </div>
            `;
            
            const text = input.value;
            input.value = '';
            container.scrollTop = container.scrollHeight;

            // Arxa fondakı serverə sorğu (api/chat)
            fetch('/api/chat', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ contents: [{ role: 'user', parts: [{ text: text }] }] })
            })
            .then(res => res.json())
            .then(data => {
                let aiReply = "Xəta baş verdi.";
                try {
                    aiReply = data.candidates[0].content.parts[0].text;
                } catch(e) {}

                container.innerHTML += `
                    <div class="flex flex-col space-y-2">
                        <div class="text-xs text-amber-500/70 font-mono">STORMX AI</div>
                        <div class="bg-[#131b2e] border gold-border p-4 rounded-2xl max-w-[85%] text-sm leading-relaxed shadow-lg">${aiReply}</div>
                    </div>
                `;
                container.scrollTop = container.scrollHeight;
            }).catch(err => {
                console.error(err);
            });
        }
    </script>
</body>
</html>
